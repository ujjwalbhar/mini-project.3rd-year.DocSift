name: docsift
description: A secure, offline-first personal knowledge vault with local AI.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.6.3

  # State Management
  flutter_riverpod: ^2.6.1

  # Database & Paths
  path_provider: ^2.1.5
  path: ^1.9.1
  sqflite_sqlcipher: ^3.3.0
  shared_preferences: ^2.5.5

  # Encryption
  pointycastle: ^3.9.1
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.6

  # File Handling & Sharing
  file_picker: ^8.1.8
  share_plus: ^10.1.4

  # PDF, OCR & Document Parsing
  syncfusion_flutter_pdfviewer: ^28.2.10
  syncfusion_flutter_pdf: ^28.2.10
  syncfusion_pdfviewer_platform_interface: ^28.2.12
  google_mlkit_text_recognition: ^1.0.1
  archive: ^4.3.0
  xml: ^6.5.0

  # On-Device AI
  onnxruntime: ^1.4.1

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  vector_math: ^2.4.3

  # Biometrics
  local_auth: ^3.0.2

  # Utilities
  uuid: ^4.5.1
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/logo.jpg
    - assets/icons/
    - assets/images/
    - assets/animations/
    - assets/models/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.jpg"
